name: Keep Supabase Awake

on:
  schedule:
    # Se ejecuta cada 3 días a las 09:00 UTC, para no llegar nunca a los 7 días de inactividad que pausan el proyecto
    - cron: '0 9 */3 * *'
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña "Actions" de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase torneo_storage table
        run: |
          curl -sS -X GET \
            "https://igvhdnhodxpeiybzxhjb.supabase.co/rest/v1/torneo_storage?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
