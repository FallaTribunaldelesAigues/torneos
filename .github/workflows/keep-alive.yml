name: Keep Supabase Awake

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 UTC, con margen amplio frente a los 7 días de inactividad que pausan el proyecto,
    # incluso si algún día falla por una incidencia puntual de red en GitHub
    - cron: '0 9 * * *'
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña "Actions" de GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase torneo_storage table
        run: |
          curl -sS -X GET \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 30 \
            "https://igvhdnhodxpeiybzxhjb.supabase.co/rest/v1/torneo_storage?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
